name: Update Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
      sha256_arm64:
        description: "SHA256 of the arm64 DMG"
        required: true
      sha256_x86_64:
        description: "SHA256 of the x86_64 DMG"
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask formula
        run: |
          CASK="Casks/agent-solutions.rb"
          sed -i "s/version \".*\"/version \"${{ inputs.version }}\"/" "$CASK"
          sed -i "s/arm:   \"[a-fA-Z0-9]*\"/arm:   \"${{ inputs.sha256_arm64 }}\"/" "$CASK"
          sed -i "s/intel: \"[a-fA-Z0-9]*\"/intel: \"${{ inputs.sha256_x86_64 }}\"/" "$CASK"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/agent-solutions.rb
          git commit -m "Update agent-solutions to v${{ inputs.version }}"
          git push
